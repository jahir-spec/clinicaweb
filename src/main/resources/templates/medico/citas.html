<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Mis Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Sistema</a>
        <div class="collapse navbar-collapse" id="navbarMedico">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/medico/dashboard">Inicio</a></li>
                <li class="nav-item"><a class="nav-link active" href="/medico/citas">Mis citas</a></li>
                <li class="nav-item"><a class="nav-link" href="/medico/citas-hoy">Citas de hoy</a></li>
				<li class="nav-item"><a class="nav-link" href="/medico/perfil">Mi Perfil</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
            <h4>Mis Citas</h4>
        </div>
        <div class="card-body">
            <table class="table table-hover table-bordered">
				<thead>
				        <tr>
				            <th>Paciente</th>
				            <th>Fecha</th>
				            <th>Hora</th>
				            <th>Estado</th>
				            <th>Acciones</th>
				        </tr>
				    </thead>
				    <tbody>
				        <tr th:each="c : ${citas}">
				            <td th:text="${c.paciente.usuario.nombre}"></td>
				            <td th:text="${c.fecha}"></td>
				            <td th:text="${c.hora}"></td>
				            <td th:text="${c.estado}"></td>
				            <td>
				                <a th:href="@{/medico/atender/{id}(id=${c.idCita})}" class="btn btn-success btn-sm">Atender</a>
				                <a th:href="@{/medico/cancelar/{id}(id=${c.idCita})}" class="btn btn-danger btn-sm">Cancelar</a>
				            </td>
				        </tr>
				    </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
