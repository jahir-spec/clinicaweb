<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema Clínica</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4" style="width: 400px;">
        <h3 class="text-center mb-4 text-primary">Iniciar Sesión</h3>

        <form th:action="@{/login}" method="post">

            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="text" name="correo" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="clave" class="form-control" required>
            </div>

            <button class="btn btn-primary w-100">Iniciar sesión</button>

            <div th:if="${param.error}" class="alert alert-danger mt-3 text-center">
                Usuario o contraseña incorrectos
            </div>

            <div th:if="${param.logout}" class="alert alert-success mt-3 text-center">
                Sesión cerrada correctamente
            </div>

        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
