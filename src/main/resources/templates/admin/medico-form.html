<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrar Médico</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light">
	
	<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
	    <div class="container">
	        <a class="navbar-brand" href="#">Sistema</a>

	        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menuAdmin">
	            <span class="navbar-toggler-icon"></span>
	        </button>

	        <div class="collapse navbar-collapse" id="menuAdmin">

	            <ul class="navbar-nav me-auto">
	                <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Inicio</a></li>
	                <li class="nav-item"><a class="nav-link" href="/admin/medicos">Médicos</a></li>
	                <li class="nav-item"><a class="nav-link" href="/admin/pacientes">Pacientes</a></li>
	                <li class="nav-item"><a class="nav-link active" href="/admin/citas">Citas</a></li>
	            </ul>

	            <form th:action="@{/logout}" method="post">
	                <button class="btn btn-outline-light">Cerrar sesión</button>
	            </form>

	        </div>
	    </div>
	</nav>


<div class="container mt-5">

    <div class="card shadow-lg border-0">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                <i class="fa-solid fa-user-doctor"></i> Registrar Médico
            </h4>
        </div>

        <div class="card-body">

            <form th:action="@{/admin/medicos/guardar}"
                  th:object="${medico}"
                  method="post">

                <!-- 🔹 DATOS DEL USUARIO -->
                <h5 class="text-primary mb-3">Datos del Usuario</h5>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Nombre</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-user"></i></span>
                            <input type="text" name="usuario.nombre" class="form-control" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Apellido</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-user"></i></span>
                            <input type="text" name="usuario.apellido" class="form-control" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Correo</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                            <input type="email" name="usuario.correo" class="form-control" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Clave</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-lock"></i></span>
                            <input type="text" name="usuario.clave" class="form-control" required>
                        </div>
                    </div>

                </div>

                <hr>

                
                <h5 class="text-primary mb-3">Datos del Médico</h5>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label>CMP</label>
                        <input type="text" th:field="*{cmp}" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Especialidad</label>
                        <select name="idEspecialidad" class="form-select">

                            <option value="">Seleccione</option>

                            <option th:each="e : ${especialidades}"
                                    th:value="${e.idEspecialidad}"
                                    th:text="${e.nombre}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control">
                    </div>

                </div>

                
                <div class="text-end mt-4">

                    <a href="/admin/medicos" class="btn btn-secondary">
                        <i class="fa fa-arrow-left"></i> Cancelar
                    </a>

                    <button class="btn btn-success">
                        <i class="fa fa-save"></i> Guardar
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
