<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">


<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Sistema</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menuAdmin">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuAdmin">

            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/medicos">Médicos</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/pacientes">Pacientes</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/citas">Citas</a></li>
            </ul>

            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light">Cerrar sesión</button>
            </form>

        </div>
    </div>
</nav>


<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <h3 class="mb-3">Lista de Citas</h3>

        <div class="table-responsive">

            <table class="table table-hover text-center align-middle">

                <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Paciente</th>
                    <th>Médico</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Estado</th>
                    <th>Pagada</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="c : ${citas}">
                    <td th:text="${c.idCita}"></td>
                    <td th:text="${c.paciente.usuario.nombre}"></td>
                    <td th:text="${c.medico.usuario.nombre}"></td>
                    <td th:text="${c.fecha}"></td>
                    <td th:text="${c.hora}"></td>

                    <td>
                        <span class="badge bg-success" th:if="${c.estado.name() == 'ATENDIDA'}">ATENDIDA</span>
                        <span class="badge bg-danger" th:if="${c.estado.name() == 'CANCELADA'}">CANCELADA</span>
                        <span class="badge bg-warning text-dark" th:if="${c.estado.name() == 'PENDIENTE'}">PENDIENTE</span>
                    </td>

                    <td>
                        <span class="badge bg-primary" th:if="${c.pagada}">SI</span>
                        <span class="badge bg-secondary" th:if="${!c.pagada}">NO</span>
                    </td>
                </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
