<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Dashboard Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>

<body>


	<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
	    <div class="container">
	        <a class="navbar-brand" href="#">Sistema</a>

	        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menuAdmin">
	            <span class="navbar-toggler-icon"></span>
	        </button>

	        <div class="collapse navbar-collapse" id="menuAdmin">

	            <ul class="navbar-nav me-auto">
	                <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Inicio</a></li>
	                <li class="nav-item"><a class="nav-link" href="/admin/medicos">Médicos</a></li>
	                <li class="nav-item"><a class="nav-link" href="/admin/pacientes">Pacientes</a></li>
	                <li class="nav-item"><a class="nav-link active" href="/admin/citas">Citas</a></li>
	            </ul>

	            <form th:action="@{/logout}" method="post">
	                <button class="btn btn-outline-light">Cerrar sesión</button>
	            </form>

	        </div>
	    </div>
	</nav>



<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <h2 class="mb-3">
            Bienvenido Administrador
            <span sec:authentication="name"></span>
        </h2>

        <p>Resumen del sistema:</p>

        <div class="row mt-4">

            <!-- MEDICOS -->
            <div class="col-md-4">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5>Total Médicos</h5>
                        <h3 th:text="${totalMedicos}"></h3>
                        <a href="/admin/medicos" class="btn btn-primary mt-3">Ver</a>
                    </div>
                </div>
            </div>

            <!-- PACIENTES -->
            <div class="col-md-4">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5>Total Pacientes</h5>
                        <h3 th:text="${totalPacientes}"></h3>
                        <a href="/admin/pacientes" class="btn btn-success mt-3">Ver</a>
                    </div>
                </div>
            </div>

            <!-- CITAS -->
            <div class="col-md-4">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5>Total Citas</h5>
                        <h3 th:text="${totalCitas}"></h3>
                        <a href="/admin/citas" class="btn btn-warning mt-3">Ver</a>
                    </div>
                </div>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
