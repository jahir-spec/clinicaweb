<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Médicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
	
			<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
			    <div class="container">
			        <a class="navbar-brand" href="#">Sistema</a>

			        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menuAdmin">
			            <span class="navbar-toggler-icon"></span>
			        </button>

			        <div class="collapse navbar-collapse" id="menuAdmin">

			            <ul class="navbar-nav me-auto">
			                <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Inicio</a></li>
			                <li class="nav-item"><a class="nav-link" href="/admin/medicos">Médicos</a></li>
			                <li class="nav-item"><a class="nav-link" href="/admin/pacientes">Pacientes</a></li>
			                <li class="nav-item"><a class="nav-link active" href="/admin/citas">Citas</a></li>
			            </ul>

			            <form th:action="@{/logout}" method="post">
			                <button class="btn btn-outline-light">Cerrar sesión</button>
			            </form>

			        </div>
			    </div>
			</nav>
<div class="container mt-5">
    <h2 class="mb-4">Listado de Médicos</h2>

    <a href="/admin/medicos/nuevo" class="btn btn-primary mb-3">
        ➕ Nuevo Médico
    </a>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>CMP</th>
            <th>Especialidad</th>
            <th>Teléfono</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="m : ${medicos}">
            <td th:text="${m.idMedico}"></td>

            <td th:text="${m.usuario.nombre + ' ' + m.usuario.apellido}"></td>

            <td th:text="${m.cmp}"></td>

            <td th:text="${m.especialidad.nombre}"></td>

            <td th:text="${m.telefono}"></td>

            <td>

                <a th:href="@{/admin/medicos/editar/{id}(id=${m.idMedico})}"
                   class="btn btn-warning btn-sm">✏</a>

                <a th:href="@{/admin/medicos/eliminar/{id}(id=${m.idMedico})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Eliminar médico?')">❌</a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
