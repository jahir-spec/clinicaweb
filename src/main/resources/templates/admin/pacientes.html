<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">


<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Sistema</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menuAdmin">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuAdmin">

            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/medicos">Médicos</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/pacientes">Pacientes</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/citas">Citas</a></li>
            </ul>

            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light">Cerrar sesión</button>
            </form>

        </div>
    </div>
</nav>


<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Lista de Pacientes</h3>
        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle text-center">

                <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="p : ${pacientes}">
                    <td th:text="${p.idPaciente}"></td>
                    <td th:text="${p.usuario.nombre + ' ' + p.usuario.apellido}"></td>
                    <td th:text="${p.usuario.correo}"></td>
                    <td th:text="${p.telefono}"></td>
                </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
