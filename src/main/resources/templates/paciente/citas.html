<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mis Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">Sistema</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPaciente" aria-controls="navbarPaciente" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarPaciente">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="/paciente/dashboard">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/paciente/citas">Ver mis citas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/paciente/citas/nueva">Registrar nueva cita</a>
        </li>
      </ul>
      <form th:action="@{/logout}" method="post" class="d-flex">
        <button class="btn btn-outline-light" type="submit">Cerrar sesión</button>
      </form>
    </div>
  </div>
</nav>


<div class="container mt-5">

    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
            <h4>Mis Citas</h4>
        </div>

        <div class="card-body">

            <table class="table table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Médico</th>
                        <th>Estado</th>
                        <th>Pagada</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cita : ${citas}">
                        <td th:text="${cita.fecha}"></td>
                        <td th:text="${cita.hora}"></td>
                        <td th:text="${cita.medico.usuario.nombre + ' ' + cita.medico.usuario.apellido}"></td>
                        <td th:text="${cita.estado}"></td>
                        <td>
                            <span th:if="${cita.pagada}" class="badge bg-success">Sí</span>
                            <span th:if="${!cita.pagada}" class="badge bg-danger">No</span>
                        </td>
                        <td>
							<a th:if="${!cita.pagada}"
							   th:href="@{/paciente/citas/pagar/{id}(id=${cita.idCita})}"
							   class="btn btn-warning btn-sm">
							    Pagar
							</a>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
    
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
