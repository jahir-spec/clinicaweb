<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nueva Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">Sistema</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPaciente" aria-controls="navbarPaciente" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarPaciente">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="/paciente/dashboard">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/paciente/citas">Ver mis citas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/paciente/citas/nueva">Registrar nueva cita</a>
        </li>
      </ul>
      <form th:action="@{/logout}" method="post" class="d-flex">
        <button class="btn btn-outline-light" type="submit">Cerrar sesión</button>
      </form>
    </div>
  </div>
</nav>


<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="mb-4">Registrar Nueva Cita</h2>

        <form th:action="@{/paciente/citas/guardar}" th:object="${cita}" method="post">
            
            <div class="mb-3">
                <label class="form-label">Médico</label>
                <select th:field="*{medico}" class="form-select" required>
                    <option value="">Seleccione</option>
                    <option th:each="m : ${medicos}"
                            th:value="${m.idMedico}"
                            th:text="${m.usuario.nombre + ' ' + m.usuario.apellido + ' - ' + m.especialidad.nombre}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" th:field="*{fecha}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Hora</label>
                <input type="time" th:field="*{hora}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="/paciente/citas" class="btn btn-secondary ms-2">Cancelar</a>

        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
