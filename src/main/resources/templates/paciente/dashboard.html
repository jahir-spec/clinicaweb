<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">Sistema</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPaciente" aria-controls="navbarPaciente" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarPaciente">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="/paciente/dashboard">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/paciente/citas">Ver mis citas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/paciente/citas/nueva">Registrar nueva cita</a>
        </li>
      </ul>
      <form th:action="@{/logout}" method="post" class="d-flex">
        <button class="btn btn-outline-light" type="submit">Cerrar sesión</button>
      </form>
    </div>
  </div>
</nav>


<div class="container mt-5">

    <div class="card shadow-lg p-4">
        <h2 class="mb-3">Bienvenido, <span sec:authentication="name">Paciente</span></h2>
        <p>Seleccione una opción:</p>

        <div class="row mt-4">

            <div class="col-md-4">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5>Ver mis citas</h5>
                        <a href="/paciente/citas" class="btn btn-primary mt-3">Ingresar</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5>Registrar nueva cita</h5>
                        <a href="/paciente/citas/nueva" class="btn btn-success mt-3">Ingresar</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
