<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boleta de Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="mb-4">Boleta de Pago</h2>

        <p><strong>Paciente:</strong> <span th:text="${cita.paciente.usuario.nombre + ' ' + cita.paciente.usuario.apellido}"></span></p>
        <p><strong>Médico:</strong> <span th:text="${cita.medico.usuario.nombre + ' ' + cita.medico.usuario.apellido}"></span></p>
        <p><strong>Fecha de la Cita:</strong> <span th:text="${#temporals.format(cita.fecha,'dd/MM/yyyy')}"></span></p>
        <p><strong>Hora de la Cita:</strong> <span th:text="${cita.hora}"></span></p>
        <p><strong>Estado:</strong> <span th:text="${cita.estado}"></span></p>
        <p><strong>Monto:</strong> S/ <span th:text="${pago.monto}"></span></p>
        <p><strong>Fecha de Pago:</strong> <span th:text="${#temporals.format(pago.fechaPago,'dd/MM/yyyy HH:mm')}"></span></p>
        <p><strong>Método de Pago:</strong> <span th:text="${pago.metodo}"></span></p>

        <div class="mt-4">
            <a th:href="@{/paciente/citas}" class="btn btn-secondary">Volver a mis citas</a>
            <a th:href="@{/paciente/citas/pagar/{id}/imprimir(id=${cita.idCita})}" 
               class="btn btn-primary">Imprimir Boleta</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
